{% extends "layout.html" %}

{% block title %}
Leaderboard
{% endblock %}

{% block main %}

<div class="container mt-5">

    <h1 class="mb-4">Leaderboard</h1>

    <table class="table table-striped table-hover">

        <thead>
            <tr>
                <th>Rank</th>
                <th>Username</th>
                <th>Points</th>
            </tr>
        </thead>

        <tbody>
            {% for user in leaderboard %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.points }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">No users found.</td>
            </tr>
            {% endfor %}
        </tbody>

    </table>

</div>

{% endblock %}
